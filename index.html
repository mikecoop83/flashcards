<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eff6ff">
  <title>Times Tables</title>
  <link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
  <link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
  <meta name="apple-mobile-web-app-title" content="Times Tables">
  <script>
    const systemTheme = window.matchMedia('(prefers-color-scheme: dark)');
    let savedTheme = null;
    try { savedTheme = localStorage.getItem('times-table-theme'); } catch {}
    if (savedTheme !== 'light' && savedTheme !== 'dark') savedTheme = null;
    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#0b162b' : '#eff6ff';
      const toggle = document.getElementById('theme-toggle');
      if (toggle) toggle.setAttribute('aria-checked', String(theme === 'dark'));
    }
    applyTheme(savedTheme || (systemTheme.matches ? 'dark' : 'light'));
    systemTheme.addEventListener('change', (event) => {
      if (!savedTheme) applyTheme(event.matches ? 'dark' : 'light');
    });
  </script>
  <style>
    :root { color-scheme: light; --bg: #eff6ff; --text: #19365b; --muted: #526b8a; --surface: #ffffff; --border: #c2d5ed; --soft: #dbeafe; --input: #ffffff; --accent: #1d4ed8; --hover: #1e40af; --on-accent: #ffffff; --focus: #3b82f6; --placeholder: #7185a1; --wrong: #a34414; --right: #167044; font-family: ui-rounded, 'Avenir Next', system-ui, sans-serif; color: var(--text); background: var(--bg); }
    :root[data-theme="dark"] { color-scheme: dark; --bg: #0b162b; --text: #e0edff; --muted: #a6bddb; --surface: #14243d; --border: #3b5577; --soft: #203b61; --input: #0e1d33; --accent: #8bbcff; --hover: #b0d2ff; --on-accent: #102342; --focus: #93c5fd; --placeholder: #8a9fbb; --wrong: #ffba8a; --right: #7bdfad; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; padding: clamp(20px, 5vw, 56px); padding-top: 16px; }
    main { max-width: 680px; margin: auto; }
    header { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 12px; }
    .mark { display: grid; place-items: center; flex-shrink: 0; width: 42px; height: 42px; background: #2563eb; color: #ffffff; border-radius: 12px; font-size: 32px; font-weight: 750; line-height: 1; }
    .brand { display: flex; align-items: center; gap: 12px; font-size: 18px; font-weight: 750; letter-spacing: -.5px; white-space: nowrap; }
    .eyebrow { font-size: 12px; font-weight: 750; letter-spacing: 2px; text-transform: uppercase; color: var(--muted); }
    .scoreboard { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 16px; }
    .score { font-size: 16px; }
    .score strong { font-size: 24px; font-variant-numeric: tabular-nums; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 28px; padding: clamp(22px, 5vw, 42px); box-shadow: 0 12px 40px #1023420a; text-align: center; }
    .question { font-size: clamp(54px, 12vw, 86px); font-weight: 750; letter-spacing: -3px; margin: 22px 0 28px; font-variant-numeric: tabular-nums; }
    .question span { color: var(--muted); font-weight: 400; }
    label { display: block; font-size: 14px; font-weight: 650; margin-bottom: 10px; }
    input { width: 100%; min-height: 78px; border: 2px solid var(--border); border-radius: 16px; background: var(--input); color: var(--text); font: 650 36px ui-rounded, system-ui, sans-serif; text-align: center; }
    input::placeholder { color: var(--placeholder); }
    input[data-finished="true"] { background: var(--soft); }
    .answer-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 10px; }
    .answer-row label { grid-column: 1; grid-row: 1; }
    .answer-row input { grid-column: 1; grid-row: 2; min-width: 0; }
    .speak-button { grid-column: 2; grid-row: 2; align-self: stretch; width: 48px; min-height: 48px; padding: 8px; background: var(--soft); color: var(--text); font-size: 22px; }
    .speak-button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
    .number-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
    .number-pad button { background: var(--soft); color: var(--text); min-height: 46px; padding: 8px; font-size: 22px; }
    .number-pad button:enabled:active { background: var(--accent); color: var(--on-accent); }
    .number-pad .edit-key { font-size: 15px; }
    button { min-height: 54px; border: 0; border-radius: 14px; padding: 14px 20px; font: 650 16px inherit; font-family: inherit; font-size: 16px; font-weight: 650; cursor: pointer; touch-action: manipulation; }
    button:disabled { opacity: .5; cursor: default; }
    input:focus-visible, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 4px; }
    .primary { background: var(--accent); color: var(--on-accent); width: 100%; margin-top: 16px; }
    .primary:hover { background: var(--hover); }
    .secondary { background: var(--soft); color: var(--text); width: 100%; margin-top: 10px; }
    .feedback { min-height: 48px; display: grid; align-content: center; margin: 14px 0 0; font-size: 15px; line-height: 1.5; color: var(--muted); }
    .feedback[data-tone="wrong"] { color: var(--wrong); }
    .feedback[data-tone="right"] { color: var(--right); }
    .reset { margin-left: auto; flex-shrink: 0; background: transparent; color: var(--muted); font-size: 13px; padding: 10px; white-space: nowrap; }
    .theme-toggle { justify-self: end; display: flex; align-items: center; gap: 8px; padding: 10px 4px; background: transparent; color: var(--text); }
    .switch-track { position: relative; display: block; width: 52px; height: 30px; border: 1px solid var(--border); border-radius: 999px; background: var(--soft); }
    .switch-track::after { content: ''; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); transition: transform 160ms ease; }
    .theme-toggle[aria-checked="true"] .switch-track::after { transform: translateX(22px); }
    .theme-icon { font-size: 20px; line-height: 1; }
    @media (prefers-reduced-motion: reduce) { .switch-track::after { transition: none; } }
    [hidden] { display: none !important; }
    @media (max-width: 600px), (max-height: 800px) { body { padding: 8px 16px 16px; } .card { padding: 18px; } .question { font-size: 52px; margin: 10px 0 14px; } input { min-height: 56px; font-size: 30px; } .feedback { margin-top: 8px; min-height: 42px; } }
    @media (max-width: 380px) { .card { padding: 22px 18px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="brand"><div class="mark" aria-hidden="true">×</div>Times Tables</div>
      <button class="theme-toggle" id="theme-toggle" type="button" role="switch" aria-label="Dark mode" aria-checked="false"><span class="theme-icon" aria-hidden="true">☀</span><span class="switch-track" aria-hidden="true"></span><span class="theme-icon" aria-hidden="true">☾</span></button>
    </header>
    <div class="scoreboard">
      <div class="score" role="status" aria-live="polite"><strong id="correct">0</strong> / <strong id="total">0</strong> correct <span id="percentage" hidden></span></div>
      <button class="reset" id="reset" type="button">Reset score ↻</button>
    </div>
    <section class="card" aria-label="Multiplication practice">
      <div class="eyebrow" id="question-number">Question 1</div>
      <div class="question" id="question" aria-live="polite"></div>
      <form id="answer-form" novalidate>
        <div class="answer-row">
          <label for="answer">Your answer</label>
          <input id="answer" name="answer" type="text" inputmode="none" readonly pattern="[0-9]*" autocomplete="off" placeholder="?" aria-describedby="feedback">
          <button class="speak-button" id="speak" type="button" aria-label="Speak answer" title="Speak answer" aria-pressed="false"><span aria-hidden="true">🎤</span></button>
        </div>
        <div class="number-pad" id="number-pad" role="group" aria-label="Number pad">
          <button type="button" data-key="1">1</button>
          <button type="button" data-key="2">2</button>
          <button type="button" data-key="3">3</button>
          <button type="button" data-key="4">4</button>
          <button type="button" data-key="5">5</button>
          <button type="button" data-key="6">6</button>
          <button type="button" data-key="7">7</button>
          <button type="button" data-key="8">8</button>
          <button type="button" data-key="9">9</button>
          <button class="edit-key" type="button" data-key="clear">Clear</button>
          <button type="button" data-key="0">0</button>
          <button class="edit-key" type="button" data-key="Backspace" aria-label="Backspace">⌫</button>
        </div>
        <button class="primary" id="check" type="submit">Check answer</button>
        <button class="secondary" id="reveal" type="button" hidden>Show the answer</button>
        <button class="primary" id="next" type="button" hidden>Next question →</button>
      </form>
      <p class="feedback" id="feedback" role="status" aria-live="polite">One question at a time. No timer, no rush.</p>
    </section>
  </main>
  <script>
    'use strict';
    const $ = (id) => document.getElementById(id);
    applyTheme(document.documentElement.dataset.theme);
    $('theme-toggle').addEventListener('click', () => {
      savedTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
      applyTheme(savedTheme);
      try { localStorage.setItem('times-table-theme', savedTheme); } catch {}
    });
    const scoreStorageKey = 'times-table-score';
    let deck = [];
    let pair;
    let correct = 0;
    let total = 0;
    try {
      const savedScore = JSON.parse(localStorage.getItem(scoreStorageKey));
      if (savedScore && Number.isSafeInteger(savedScore.correct) && Number.isSafeInteger(savedScore.total)
          && savedScore.correct >= 0 && savedScore.total >= savedScore.correct) {
        correct = savedScore.correct;
        total = savedScore.total;
      }
    } catch {}
    let questionNumber = 0;
    let attempted = false;
    let finished = false;
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;

    const smallNumbers = 'zero one two three four five six seven eight nine ten eleven twelve thirteen fourteen fifteen sixteen seventeen eighteen nineteen'.split(' ');
    const tens = 'zero ten twenty thirty forty fifty sixty seventy eighty ninety'.split(' ');
    function numberWords(n) {
      if (n < 20) return smallNumbers[n];
      if (n < 100) return tens[Math.floor(n / 10)] + (n % 10 ? ' ' + smallNumbers[n % 10] : '');
      return smallNumbers[Math.floor(n / 100)] + ' hundred' + (n % 100 ? ' ' + numberWords(n % 100) : '');
    }
    const spokenNumbers = new Map(Array.from({ length: 1000 }, (_, n) => [numberWords(n), String(n)]));
    function parseSpokenNumber(transcript) {
      const normalized = transcript.toLowerCase().trim().replace(/[.!?]+$/, '').replace(/-/g, ' ').replace(/\band\b/g, ' ').replace(/\s+/g, ' ').trim();
      if (/^\d{1,3}$/.test(normalized)) return String(Number(normalized));
      return spokenNumbers.get(normalized) ?? null;
    }

    function stopListening() {
      const previous = recognition;
      recognition = null;
      $('speak').firstElementChild.textContent = '🎤';
      $('speak').setAttribute('aria-label', 'Speak answer');
      $('speak').title = 'Speak answer';
      $('speak').setAttribute('aria-pressed', 'false');
      if (previous) previous.abort();
    }

    $('speak').addEventListener('click', () => {
      if (finished) return;
      if (recognition) {
        stopListening();
        feedback('Listening canceled. You can use the number pad.');
        return;
      }
      if (!SpeechRecognition) {
        feedback('Voice input isn’t supported in this browser. Use the number pad instead.');
        return;
      }
      const session = new SpeechRecognition();
      recognition = session;
      session.lang = 'en-US';
      session.continuous = false;
      session.interimResults = false;
      session.maxAlternatives = 1;
      $('speak').firstElementChild.textContent = '■';
      $('speak').setAttribute('aria-label', 'Stop listening');
      $('speak').title = 'Stop listening';
      $('speak').setAttribute('aria-pressed', 'true');
      feedback('Listening… say your answer in English.');
      session.onresult = (event) => {
        if (recognition !== session || finished) return;
        const transcript = event.results[0][0].transcript;
        const value = parseSpokenNumber(transcript);
        stopListening();
        if (value === null) {
          feedback('Heard “' + transcript + '”. Please say a whole number, or use the number pad.');
          return;
        }
        $('answer').value = value;
        $('answer').setSelectionRange(value.length, value.length);
        $('answer').removeAttribute('aria-invalid');
        feedback('Heard ' + value + '. Check your answer when you’re ready.');
        $('answer').focus({ preventScroll: true });
      };
      session.onerror = (event) => {
        if (recognition !== session) return;
        stopListening();
        const messages = {
          'not-allowed': 'Microphone access wasn’t allowed. Allow it in your browser settings, or use the number pad.',
          'service-not-allowed': 'Voice input isn’t available here. Try a supported browser, or use the number pad.',
          'audio-capture': 'No microphone is available. You can use the number pad.',
          'network': 'Voice input couldn’t connect. Check your connection or use the number pad.',
          'no-speech': 'No speech was heard. Try again or use the number pad.'
        };
        feedback(messages[event.error] || 'Voice input didn’t work. Try again or use the number pad.');
      };
      session.onend = () => {
        if (recognition !== session) return;
        stopListening();
        feedback('No answer was recognized. Try again or use the number pad.');
      };
      try { session.start(); }
      catch {
        stopListening();
        feedback('Couldn’t start voice input. Try opening the site over HTTPS, or use the number pad.');
      }
    });
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && recognition) {
        stopListening();
        feedback('Listening paused. Tap Speak answer to try again.');
      }
    });

    function refillDeck() {
      deck = Array.from({ length: 169 }, (_, n) => [Math.floor(n / 13), n % 13]);
      for (let i = deck.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [deck[i], deck[j]] = [deck[j], deck[i]];
      }
      // Avoid the same question on either side of a deck boundary.
      if (pair && deck.at(-1).join() === pair.join()) {
        [deck[0], deck[168]] = [deck[168], deck[0]];
      }
    }

    function feedback(message, tone = '') {
      $('feedback').textContent = message;
      $('feedback').dataset.tone = tone;
    }

    function updateScore() {
      $('correct').textContent = correct;
      $('total').textContent = total;
      $('percentage').hidden = total === 0;
      $('percentage').textContent = total > 0 ? '(' + Math.round(correct / total * 100) + '%)' : '';
    }

    function saveScore() {
      try { localStorage.setItem(scoreStorageKey, JSON.stringify({ correct, total })); } catch {}
    }

    function newQuestion(focus = true) {
      stopListening();
      $('speak').disabled = false;
      if (!deck.length) refillDeck();
      pair = deck.pop();
      attempted = false;
      finished = false;
      questionNumber++;
      $('question-number').textContent = 'Question ' + questionNumber;
      $('question').textContent = pair[0] + ' × ' + pair[1] + ' = ?';
      $('answer').value = '';
      $('answer').dataset.finished = 'false';
      for (const button of $('number-pad').querySelectorAll('button')) button.disabled = false;
      $('answer').removeAttribute('aria-invalid');
      $('check').hidden = false;
      $('check').textContent = 'Check answer';
      $('reveal').hidden = true;
      $('next').hidden = true;
      feedback('One question at a time. No timer, no rush.');
      if (focus) $('answer').focus();
    }

    function finish() {
      stopListening();
      $('speak').disabled = true;
      finished = true;
      $('question').textContent = pair[0] + ' × ' + pair[1] + ' = ' + pair[0] * pair[1];
      $('answer').dataset.finished = 'true';
      for (const button of $('number-pad').querySelectorAll('button')) button.disabled = true;
      $('answer').removeAttribute('aria-invalid');
      $('check').hidden = true;
      $('reveal').hidden = true;
      $('next').hidden = false;
      $('next').focus();
    }

    function editAnswer(key) {
      if (finished) return;
      if (recognition) {
        stopListening();
        feedback('Use the number pad, then check your answer.');
      }
      const input = $('answer');
      let start = input.selectionStart;
      let end = input.selectionEnd;
      let insert = '';
      if (key === 'clear') { start = 0; end = input.value.length; }
      else if (key === 'Backspace') { if (start === end) start = Math.max(0, start - 1); }
      else if (key === 'Delete') { if (start === end) end = Math.min(input.value.length, end + 1); }
      else { insert = key.replace(/[^0-9]/g, ''); if (!insert) return; }
      input.value = input.value.slice(0, start) + insert + input.value.slice(end);
      input.setSelectionRange(start + insert.length, start + insert.length);
      input.removeAttribute('aria-invalid');
    }

    $('number-pad').addEventListener('pointerdown', (event) => {
      if (event.target.closest('button')) event.preventDefault();
    });
    $('number-pad').addEventListener('click', (event) => {
      const button = event.target.closest('button');
      if (!button || finished) return;
      editAnswer(button.dataset.key);
      $('answer').focus({ preventScroll: true });
    });
    $('answer').addEventListener('keydown', (event) => {
      if (event.ctrlKey || event.metaKey || event.altKey) return;
      if (/^[0-9]$/.test(event.key) || event.key === 'Backspace' || event.key === 'Delete') {
        event.preventDefault();
        editAnswer(event.key);
      } else if (event.key === 'Enter') {
        event.preventDefault();
        if (finished) newQuestion();
        else $('answer-form').requestSubmit();
      }
    });
    $('answer').addEventListener('paste', (event) => {
      event.preventDefault();
      editAnswer(event.clipboardData.getData('text'));
    });

    $('answer-form').addEventListener('submit', (event) => {
      event.preventDefault();
      if (finished) return;
      stopListening();
      const value = $('answer').value.trim();
      if (!/^\d+$/.test(value)) {
        feedback('Enter a whole number, like 0, 12, or 144.');
        $('answer').setAttribute('aria-invalid', 'true');
        $('answer').focus();
        return;
      }
      const isCorrect = Number(value) === pair[0] * pair[1];
      const firstTry = !attempted;
      if (firstTry) {
        total++;
        if (isCorrect) correct++;
        attempted = true;
        updateScore();
        saveScore();
      }
      if (isCorrect) {
        feedback(firstTry ? 'That’s right! Nicely done.' : 'You got it! Practice pays off.', 'right');
        finish();
      } else {
        feedback('Not quite. Try again, or take a look at the answer.', 'wrong');
        $('answer').setAttribute('aria-invalid', 'true');
        $('check').textContent = 'Try again';
        $('reveal').hidden = false;
        $('answer').focus();
        $('answer').select();
      }
    });

    $('reveal').addEventListener('click', () => {
      if (finished || !attempted) return;
      $('answer').value = pair[0] * pair[1];
      feedback(pair[0] + ' × ' + pair[1] + ' = ' + pair[0] * pair[1] + '. You’ll get it with practice.');
      finish();
    });
    $('next').addEventListener('click', () => { if (finished) newQuestion(); });
    $('reset').addEventListener('click', () => {
      if (!window.confirm('Are you sure you want to reset your score?')) return;
      correct = 0;
      total = 0;
      questionNumber = 0;
      deck = [];
      updateScore();
      saveScore();
      newQuestion();
    });
    updateScore();
    newQuestion(false);
  </script>
</body>
</html>
